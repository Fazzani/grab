name: grab
on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
  schedule:
    - cron:  '0 3 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install dependencies and run regression checks
      run: |
        python -m pip install pandas jinja2
        python -m unittest discover -s tests -p 'test_*.py' -v
        bash tests/test_pipeline.sh

    - name: Download & merge xmltv files
      env:
        EPG_URLS: ${{ secrets.EPG_URLS }}
      run: |
        chmod +x ./build.sh
        export EPG_TMP_DIR="$(mktemp -d)"
        trap 'rm -rf "$EPG_TMP_DIR"' EXIT

        echo -e "--------------- downloading xmltv files\n"
        source ./scripts/utils.sh
        split_epg_urls "$EPG_URLS"
        [[ ${#epg_urls[@]} -gt 0 ]] || { echo "EPG_URLS is empty" >&2; exit 1; }
        ./build.sh --download "${epg_urls[@]}"

        echo -e "--------------- merging xmltv files\n"
        ./build.sh --merge
        bash tests/test_xmltv_integration.sh

    - name: Update md files
      run: |
        echo -e "--------------- epg stats\n"

        ls -lah

        python ./scripts/check.py .
        python ./scripts/stats_epg.py -s -f out/epg.csv

        echo -e "--------------- generating md files\n"

        chmod +x ./scripts/readme.sh && ./scripts/readme.sh
        chmod +x ./scripts/missed_channels.sh && ./scripts/missed_channels.sh
  
    - name: Commit & Push changes
      uses: actions-js/push@master
      with:
        github_token: ${{ secrets.API_TOKEN }}
        author_email: "heni.fazzani@gmail.com"
        author_name: "Heni Fazzani"
        branch: "master"
